[package]
name = "svgui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
rfd = "0.17.2"
cpal = "0.18"
softvoice = { path = "../port/crates/softvoice" }

# The original-DLL backend (for comparison) only exists in 32-bit builds:
#   cargo build --release --target i686-pc-windows-msvc
[target.'cfg(target_arch = "x86")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Graphics_Gdi"] }
